name: M2D3 review hardening patch

on:
  push:
    branches:
      - m2d3-achievement-authority-cutover
    paths:
      - .github/workflows/m2d3-review-harden.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2d3-achievement-authority-cutover
          fetch-depth: 0
      - name: Apply hardening patch
        run: python scripts/m2d3_review_hardening_patch.py
      - name: Commit hardening patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vars.js tests/characterization/m2d-achievement-state.test.cjs
          git diff --cached --quiet || git commit -m "Harden M2D3 rebinding and migration ratchet"
          git push origin HEAD:m2d3-achievement-authority-cutover
