name: M3F3 one-time roadmap cleanup

on:
  push:
    branches:
      - m3f3-dna-live-cutover

permissions:
  contents: write

jobs:
  cleanup-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded M3F3 documentation cleanup
        run: node scripts/m3f3-docs-cleanup.cjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcile M3F3 roadmap and backlog"
          git push origin HEAD:m3f3-dna-live-cutover
