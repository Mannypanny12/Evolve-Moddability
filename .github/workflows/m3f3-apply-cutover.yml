name: M3F3 one-time DNA source cutover

on:
  push:
    branches:
      - m3f3-dna-live-cutover

permissions:
  contents: write

jobs:
  apply-cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded actions.js cutover
        run: node scripts/m3f3-apply-cutover.cjs
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Cut over vanilla DNA action to command runtime"
          git push origin HEAD:m3f3-dna-live-cutover
