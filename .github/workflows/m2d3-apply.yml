name: M2D3 apply source cutover

on:
  push:
    branches:
      - m2d3-achievement-authority-cutover
    paths:
      - .github/workflows/m2d3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2d3-achievement-authority-cutover
          fetch-depth: 0
      - name: Apply cutover patch
        run: python scripts/m2d3_apply_patch.py
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vars.js src/achieve.js tests/legacy/legacy-api.js tests/characterization/m2d-achievement-state.test.cjs
          git diff --cached --quiet || git commit -m "Wire M2D3 achievement authority cutover"
          git push origin HEAD:m2d3-achievement-authority-cutover
