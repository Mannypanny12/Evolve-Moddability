name: Baseline build

on:
  push:
    branches:
      - master
      - modding-foundation
      - "m0*"
      - "m1*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Node 20 full build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Build game and wiki
        run: npm run build

      - name: Check build only changed generated outputs
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "Tracked files changed by build:"
          printf '%s\n' "$changed"

          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(evolve/main\.js|evolve/evolve\.css|wiki/wiki\.js|wiki/wiki\.css) || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked files changed by the build:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
