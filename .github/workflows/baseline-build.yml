name: Baseline build

on:
  push:
    branches:
      - master
      - modding-foundation
      - "m0*"
      - "m1*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Node 20 full build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Capture M0E1 observation-schema 3 goldens
        if: github.event_name == 'push' && github.ref == 'refs/heads/m0e1-authoritative-state-correction'
        shell: bash
        run: |
          npm run oracle:update -- --all --accept

          git add tests/simulation/oracle-baselines.json tests/simulation/oracle-snapshots/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "M0E1 correction: recapture schema 3 oracle snapshots"
            git push origin HEAD:m0e1-authoritative-state-correction
          fi

      - name: Run test suite
        run: npm test

      - name: Build game and wiki
        run: npm run build

      - name: Check build only changed generated outputs
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "Tracked files changed by build:"
          printf '%s\n' "$changed"

          unexpected=0
          while IFS= read -r file; do
            case "$file" in
              ""|evolve/main.js|evolve/evolve.css|wiki/wiki.js|wiki/wiki.css)
                ;;
              *)
                echo "Unexpected tracked file changed by the build: $file"
                unexpected=1
                ;;
            esac
          done <<< "$changed"

          test "$unexpected" -eq 0
