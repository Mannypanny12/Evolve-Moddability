name: Baseline build

on:
  push:
    branches:
      - master
      - modding-foundation
      - "m*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Node 20 full build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject committed generated bundles in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          git fetch --no-tags --depth=1 origin "$base_sha" "$head_sha"
          changed="$(git diff --name-only "$base_sha" "$head_sha")"

          echo "Files changed by this pull request:"
          printf '%s\n' "$changed"

          generated=0
          while IFS= read -r file; do
            case "$file" in
              evolve/main.js|evolve/evolve.css|wiki/wiki.js|wiki/wiki.css)
                echo "Generated bundle must not be committed in a pull request: $file"
                generated=1
                ;;
            esac
          done <<< "$changed"

          test "$generated" -eq 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run architecture fitness gate
        run: npm run test:architecture

      - name: Build game and wiki
        run: npm run build

      - name: Check build only changed generated outputs
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "Tracked files changed by build:"
          printf '%s\n' "$changed"

          unexpected=0
          while IFS= read -r file; do
            case "$file" in
              ""|evolve/main.js|evolve/evolve.css|wiki/wiki.js|wiki/wiki.css)
                ;;
              *)
                echo "Unexpected tracked file changed by the build: $file"
                unexpected=1
                ;;
            esac
          done <<< "$changed"

          test "$unexpected" -eq 0

      - name: Set up matching ChromeDriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c # v3

      - name: Show browser versions
        run: |
          google-chrome --version || chromium --version
          chromedriver --version

      - name: Prove real-browser smoke rejects startup exceptions
        shell: bash
        run: |
          set +e
          M0E4_INJECT_STARTUP_FAILURE=1 npm run test:browser > /tmp/m0e4-negative-control.log 2>&1
          status=$?
          set -e

          cat /tmp/m0e4-negative-control.log

          if [ "$status" -eq 0 ]; then
            echo "Browser smoke unexpectedly passed with an injected Evolve startup exception."
            exit 1
          fi

          grep -q "M0E4_INJECTED_STARTUP_FAILURE" /tmp/m0e4-negative-control.log

      - name: Run real-browser smoke test
        run: npm run test:browser
