name: Baseline build

on:
  push:
    branches:
      - master
      - modding-foundation
      - "m0*"
      - "m1*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Node 20 full build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build game and wiki
        run: npm run build

      - name: Check build only changed generated outputs
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "Tracked files changed by build:"
          printf '%s\n' "$changed"

          unexpected=0
          while IFS= read -r file; do
            case "$file" in
              ""|evolve/main.js|evolve/evolve.css|wiki/wiki.js|wiki/wiki.css)
                ;;
              *)
                echo "Unexpected tracked file changed by the build: $file"
                unexpected=1
                ;;
            esac
          done <<< "$changed"

          test "$unexpected" -eq 0
