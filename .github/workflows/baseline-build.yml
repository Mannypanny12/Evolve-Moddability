name: Baseline build

on:
  push:
    branches:
      - master
      - modding-foundation
      - "m0*"
      - "m1*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Node 20 full build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Bootstrap M0E2 oracle snapshots
        run: npm run oracle:update -- --all

      - name: Upload M0E2 oracle snapshots
        uses: actions/upload-artifact@v4
        with:
          name: m0e2-oracle-snapshots
          path: tests/simulation/oracle-snapshots
          if-no-files-found: error

      - name: Commit bootstrapped M0E2 snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/simulation/oracle-snapshots
          if ! git diff --cached --quiet; then
            git commit -m "M0E2: commit inspectable oracle snapshots"
            git push origin HEAD:m0e2-inspectable-oracle-snapshots
          fi

      - name: Run test suite
        run: npm test

      - name: Build game and wiki
        run: npm run build

      - name: Check build only changed generated outputs
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "Tracked files changed by build:"
          printf '%s\n' "$changed"

          unexpected=0
          while IFS= read -r file; do
            case "$file" in
              ""|evolve/main.js|evolve/evolve.css|wiki/wiki.js|wiki/wiki.css)
                ;;
              *)
                echo "Unexpected tracked file changed by the build: $file"
                unexpected=1
                ;;
            esac
          done <<< "$changed"

          test "$unexpected" -eq 0
